version: "3.9"

services:

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user         
      POSTGRES_PASSWORD: password  
      POSTGRES_DB: aerobic         
    volumes:
      - postgres_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"   

  backend:
    build:
      context: .          
      dockerfile: DockerFile
    restart: always
    env_file:
      - .env              
    ports:
      - "8000:8000"       
    depends_on:
      - db  
    volumes:
      - .:/app            

volumes:
  postgres_data:          
